<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tennis Pro Shop</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#f5f7fa;
}

header{
    background:#0b7a42;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin-bottom:15px;
}

.filter-bar{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.filter-bar input,
.filter-bar select{
    padding:12px;
    border:none;
    border-radius:8px;
    min-width:220px;
}

.filter-bar button{
    background:white;
    color:#0b7a42;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.hero{
    height:350px;
    background-image:url('https://images.unsplash.com/photo-1542144582-1ba00456b5e3?w=1600');
    background-size:cover;
    background-position:center;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    text-shadow:2px 2px 10px black;
}

.hero h2{
    font-size:3rem;
}

.hero p{
    font-size:1.2rem;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:25px;
    padding:40px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.content{
    padding:20px;
}

.content h3{
    margin-bottom:10px;
}

.kategorija{
    color:#666;
    margin-bottom:10px;
}

.cijena{
    color:#0b7a42;
    font-size:1.5rem;
    font-weight:bold;
    margin-bottom:10px;
}

.zaliha{
    margin-bottom:15px;
}

.kupi{
    width:100%;
    border:none;
    background:#0b7a42;
    color:white;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

footer{
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
}

</style>
</head>

<body>

<header>

    <h1>🎾 Tennis Pro Shop</h1>
<div style="margin-bottom:15px;">
    <a
      href="kosarica.html"
      style="
        color:white;
        text-decoration:none;
        font-weight:bold;
        background:#095f33;
        padding:10px 15px;
        border-radius:8px;
      ">
        🛒 Košarica
    </a>
</div>
    <div class="filter-bar">

        <input
            type="text"
            id="pretraga"
            placeholder="Pretraži proizvode..."
        >

        <select id="kategorija">
            <option value="">Sve kategorije</option>
            <option value="Reketi">Reketi</option>
            <option value="Obuća">Obuća</option>
            <option value="Torbe">Torbe</option>
            <option value="Loptice">Loptice</option>
        </select>

        <button onclick="ucitajProizvode()">
            Pretraži
        </button>
        
    </div>

</header>

<section class="hero">
    <h2>Nova kolekcija 2026</h2>
    <p>Najpopularnija teniska oprema po akcijskim cijenama</p>
</section>

<section class="products" id="proizvodi"></section>

<footer>
    © 2026 Tennis Pro Shop
</footer>

<script>

async function ucitajProizvode() {

    const pojam =
        document.getElementById('pretraga').value;

    const kategorija =
        document.getElementById('kategorija').value;

    let url = '/api/proizvodi';

    const parametri = [];

    if (pojam) {
        parametri.push(
            `pretraga=${encodeURIComponent(pojam)}`
        );
    }

    if (kategorija) {
        parametri.push(
            `kategorija=${encodeURIComponent(kategorija)}`
        );
    }

    if (parametri.length > 0) {
        url += '?' + parametri.join('&');
    }

    const odgovor = await fetch(url);
    const proizvodi = await odgovor.json();

    const spremnik =
        document.getElementById('proizvodi');

    spremnik.innerHTML = '';

    proizvodi.forEach(proizvod => {

        spremnik.innerHTML += `
        <div class="card">

            <img
                src="${proizvod.slika}"
                alt="${proizvod.naziv}"
            >

            <div class="content">

                <h3>${proizvod.naziv}</h3>

                <p class="kategorija">
                    ${proizvod.kategorija}
                </p>

                <p class="cijena">
                    ${proizvod.cijena} €
                </p>

                <p class="zaliha">
                    Na zalihi: ${proizvod.zaliha}
                </p>

                <button
    class="kupi"
    onclick="dodajUKosaricu(${proizvod.id})">
    Dodaj u košaricu
</button>

            </div>

        </div>
        `;
    });
}

ucitajProizvode();
async function dodajUKosaricu(id) {

  const odgovor = await fetch(
    '/api/kosarica',
    {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ id })
    }
  );

  const podaci = await odgovor.json();

  alert(podaci.poruka);
}
</script>

</body>
</html>
